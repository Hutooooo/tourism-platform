# Render Blueprint — single web service (API + built SPA)
#
# Free tier caveat: the filesystem is EPHEMETRAL. SQLite (server/data/app.db)
# and uploads (server/uploads) are wiped on every deploy, restart and sleep.
# For a real site, upgrade to Starter ($7/mo) and add a Disk (see services[0].disk).
#
# Dashboard-only alternative: skip this file and paste the same values into
# New → Web Service → repo → Runtime: Node.

services:
  - type: web
    name: tourism-sl-it
    runtime: node
    plan: free          # change to starter + add disk for persistence

    # Build: install both workspaces, then vite build → client/dist
    buildCommand: npm run setup && npm run build

    # Seed is idempotent (won't clobber existing admin/settings/content),
    # then start the single Express process that serves /api and the SPA.
    startCommand: npm run seed && npm start

    # Express serves the SPA itself; probe the API, not "/".
    healthCheckPath: /api/health

    # Render injects PORT. config.js already binds 0.0.0.0:$PORT.
    envVars:
      - key: NODE_ENV
        value: production

      # Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      # Use a DIFFERENT value for each. Mark as "secret" in the dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_JWT_SECRET
        generateValue: true

      # First boot creates the admin row from these; seed skips if it exists.
      #
      # ADMIN_PASSWORD is generated by Render and never printed in logs.
      # Read it in the dashboard: service → Environment tab → reveal the
      # ADMIN_PASSWORD value. Paste it at /admin, then change it from the
      # dashboard (or PATCH /api/auth/password).
      #
      # FREE PLAN ONLY: the database is recreated on every cold start, so
      # the admin row is recreated from ADMIN_PASSWORD every time and an
      # in-app password change does not stick. On free, ADMIN_PASSWORD
      # *is* the login — pick a strong one and keep this dashboard private.
      - key: ADMIN_EMAIL
        value: admin@localhost.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator

      # Public origin of THIS service (no trailing slash).
      # Free tier URL looks like https://tourism-sl-it.onrender.com
      #
      # VERIFY after the first deploy: if that hostname is already taken,
      # Render assigns tourism-sl-it-<random>.onrender.com instead. Update
      # both values to whatever the service Overview page actually shows.
      # After a custom domain is attached, change both to that domain.
      #
      # Same-origin requests skip CORS, so a mismatch here will not break
      # the SPA — but PUBLIC_API_URL does feed absolute media/OG URLs.
      - key: PUBLIC_API_URL
        value: https://tourism-sl-it.onrender.com
      - key: CLIENT_ORIGINS
        value: https://tourism-sl-it.onrender.com

      # Same-origin SPA: leave VITE_API_URL unset so the client calls /api
      # on whatever host serves the page. (Build-time only; not needed here.)

      # --- Persistence -------------------------------------------------
      # Relative paths are resolved against server/ (NOT the repo root and
      # NOT the process cwd), so these two values write to:
      #   server/data/app.db   and   server/uploads/
      #
      # On the free plan those live on the container filesystem, which is
      # wiped on every deploy, restart and sleep. Enabling a Disk is not
      # enough on its own: if you add the `disk:` block below, you MUST
      # also change BOTH of these to absolute paths on that disk. Change
      # one without the other and part of your data keeps landing on the
      # ephemeral filesystem, where it silently disappears.
      - key: DATABASE_FILE
        value: ./data/app.db
      - key: UPLOAD_DIR
        value: ./uploads

      # COOKIE_SECURE defaults to true when NODE_ENV=production (correct
      # for https://*.onrender.com). Leave unset unless you know otherwise.
      # - key: COOKIE_SECURE
      #   value: "true"

    # Free tier: 512MB RAM, shared CPU, sleeps after ~15 min idle.
    #
    # Paid Starter: add a disk AND change both path env vars above to the
    # mount point. Enabling the disk alone does nothing for this app.
    # disk:
    #   name: tourism-data
    #   mountPath: /data
    #   sizeGB: 1
